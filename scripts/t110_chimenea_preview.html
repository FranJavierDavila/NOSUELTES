<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#888}</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script></head>
<body><canvas id="c" style="width:100%;height:100%"></canvas>
<script>
// T110: identificar la chimenea de base.glb — marcadores en los clústeres altos.
const CAND = [
  { n: 1, x: 4.79, y: 5.12, z: -2.98, col: [1, 0, 0] },   // rojo: centro (sobre root)
  { n: 2, x: 3.81, y: 5.03, z: -2.43, col: [0, 1, 0] },   // verde
  { n: 3, x: 5.59, y: 5.02, z: -1.65, col: [0, 0.4, 1] }, // azul
  { n: 4, x: 3.88, y: 5.00, z: -1.75, col: [1, 1, 0] },   // amarillo
  { n: 5, x: 5.54, y: 5.01, z: -3.92, col: [1, 0, 1] },   // magenta
  { n: 6, x: 5.32, y: 5.07, z: -2.40, col: [0, 1, 1] },   // cian
];
window.__READY = false;
const engine = new BABYLON.Engine(document.getElementById('c'), true);
const scene = new BABYLON.Scene(engine);
const cam = new BABYLON.ArcRotateCamera('c', -Math.PI / 2.3, 1.15, 16, new BABYLON.Vector3(4.8, 2.5, -2.9), scene);
cam.attachControl(true);
new BABYLON.HemisphericLight('l', new BABYLON.Vector3(0, 1, 0), scene).intensity = 0.9;
const dir = new BABYLON.DirectionalLight('d', new BABYLON.Vector3(-0.4, -1, 0.3), scene);
dir.position = new BABYLON.Vector3(10, 20, -10);
BABYLON.SceneLoader.ImportMeshAsync("", '/public/models/base.glb').then((res) => {
  const root = new BABYLON.TransformNode('r', scene);
  root.position.set(4.8, 0, -2.9); root.rotation.y = Math.PI; root.scaling.setAll(5.2);
  for (const m of res.meshes) if (!m.parent) m.parent = root;
  // marcador: columna vertical desde y=0 hasta y=6 sobre cada candidato
  for (const c of CAND) {
    const col = new BABYLON.Color3(c.col[0], c.col[1], c.col[2]);
    for (let y = 0.4; y <= 6; y += 0.55) {
      const box = BABYLON.MeshBuilder.CreateBox('m' + c.n + '_' + y.toFixed(1), { size: 0.16 }, scene);
      box.position.set(c.x, y, c.z);
      const mat = new BABYLON.StandardMaterial('mm', scene);
      mat.emissiveColor = col; mat.disableLighting = true;
      box.material = mat;
    }
  }
  scene.render();
  window.__READY = true;
});
engine.runRenderLoop(() => scene.render());
</script></body></html>
