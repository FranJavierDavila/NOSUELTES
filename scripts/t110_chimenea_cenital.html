<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#888}</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script></head>
<body><canvas id="c" style="width:100%;height:100%"></canvas>
<script>
// T110b: vista CENITAL — qué columna cae sobre la chimenea (XZ exacto).
const CAND = [
  { n: 1, x: 4.79, z: -2.98, col: [1, 0, 0] },   // rojo
  { n: 2, x: 3.81, z: -2.43, col: [0, 1, 0] },   // verde
  { n: 3, x: 5.59, z: -1.65, col: [0, 0.4, 1] }, // azul
  { n: 4, x: 3.88, z: -1.75, col: [1, 1, 0] },   // amarillo
  { n: 5, x: 5.54, z: -3.92, col: [1, 0, 1] },   // magenta
  { n: 6, x: 5.32, z: -2.40, col: [0, 1, 1] },   // cian
  { n: 7, x: 3.81, z: -3.37, col: [1, 1, 1] },   // blanco (inversa del pico)
];
window.__READY = false;
const engine = new BABYLON.Engine(document.getElementById('c'), true);
const scene = new BABYLON.Scene(engine);
const cam = new BABYLON.ArcRotateCamera('c', -Math.PI / 2, 0.12, 14, new BABYLON.Vector3(4.8, 3.5, -2.9), scene);
new BABYLON.HemisphericLight('l', new BABYLON.Vector3(0, 1, 0), scene).intensity = 1.0;
const dir = new BABYLON.DirectionalLight('d', new BABYLON.Vector3(-0.2, -1, 0.1), scene);
dir.position = new BABYLON.Vector3(8, 20, -6);
BABYLON.SceneLoader.ImportMeshAsync("", '/public/models/base.glb').then((res) => {
  const root = new BABYLON.TransformNode('r', scene);
  root.position.set(4.8, 0, -2.9); root.rotation.y = Math.PI; root.scaling.setAll(5.2);
  for (const m of res.meshes) if (!m.parent) m.parent = root;
  for (const c of CAND) {
    const col = new BABYLON.Color3(c.col[0], c.col[1], c.col[2]);
    for (let y = 3.2; y <= 6.4; y += 0.3) {
      const box = BABYLON.MeshBuilder.CreateBox('m', { size: 0.14 }, scene);
      box.position.set(c.x, y, c.z);
      const mat = new BABYLON.StandardMaterial('mm', scene);
      mat.emissiveColor = col; mat.disableLighting = true;
      box.material = mat;
    }
  }
  scene.render();
  window.__READY = true;
});
engine.runRenderLoop(() => scene.render());
</script></body></html>
