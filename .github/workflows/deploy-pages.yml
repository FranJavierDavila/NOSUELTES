# T85 — Despliegue a GitHub Pages: exportación estática del juego en cada push a main.
name: Despliegue a GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La exportación estática no admite rutas force-dynamic (src/app/api);
      # el juego publicado es solitario + cooperativo local (todo cliente).
      - run: rm -rf src/app/api
      - run: STATIC_EXPORT=1 EXPORT_BASE_PATH=/NOSUELTES npx next build
      # Crea el sitio de Pages (Source: Actions) si aún no existe, con el
      # GITHUB_TOKEN del workflow (pages: write) — cero pasos manuales.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
